apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finguard-ingress
  namespace: finguard
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.finguard.io]
      secretName: finguard-tls
  rules:
    - host: api.finguard.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: finguard-api, port: { number: 80 } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: finguard
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "1Gi" }
          volumeMounts: [{ name: redis-data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: redis-data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: finguard
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
  clusterIP: None
