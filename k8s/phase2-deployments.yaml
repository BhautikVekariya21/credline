apiVersion: apps/v1
kind: Deployment
metadata:
  name: finguard-frontend
  namespace: finguard
  labels: { app: finguard-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: finguard-frontend }
  template:
    metadata:
      labels: { app: finguard-frontend }
    spec:
      containers:
        - name: frontend
          image: finguard/frontend:latest
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: finguard-frontend
  namespace: finguard
spec:
  selector: { app: finguard-frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finguard-mlflow
  namespace: finguard
  labels: { app: finguard-mlflow }
spec:
  replicas: 1
  selector:
    matchLabels: { app: finguard-mlflow }
  template:
    metadata:
      labels: { app: finguard-mlflow }
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.16.0
          command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000"]
          ports: [{ containerPort: 5000 }]
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "2Gi" }
          volumeMounts: [{ name: mlflow-data, mountPath: /mlflow }]
      volumes:
        - name: mlflow-data
          persistentVolumeClaim: { claimName: mlflow-pvc }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-pvc
  namespace: finguard
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: finguard-mlflow
  namespace: finguard
spec:
  selector: { app: finguard-mlflow }
  ports: [{ port: 5000, targetPort: 5000 }]
