# ═══════════════════════════════════════════════════════════════════════════
# FinGuard 2026 — Federated Learning Multi-Node Docker Compose
#
# Spins up a complete federated learning environment:
#   - FL Server (Secure Aggregation + DP)
#   - 3 Bank Nodes (A, B, C) with DP-SGD trainers
#   - MLflow for global model versioning
#   - Shared network for inter-node gRPC communication
#
# Usage:
#   docker-compose -f docker-compose.federation.yaml up --build
# ═══════════════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  fl-network:
    driver: bridge
    name: finguard-federation

services:
  # ─── FL Aggregation Server ────────────────────────────────────────
  fl-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finguard-fl-server
    command: python -m consortium.fl_server --rounds 20 --min-clients 3
    environment:
      - FL_SERVER_ADDRESS=0.0.0.0:8080
      - DP_EPSILON=1.0
      - DP_DELTA=1e-5
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8080:8080"
    networks:
      - fl-network
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost',8080)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  # ─── Bank A Client ──────────────────────────────────────────────
  bank-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finguard-bank-a
    command: python -m consortium.fl_client --bank-id bank-a --server fl-server:8080
    environment:
      - BANK_ID=bank-a
      - BANK_NAME=First National Bank
      - FL_SERVER=fl-server:8080
      - DP_NOISE_MULTIPLIER=0.1
      - DP_MAX_GRAD_NORM=1.0
      - LOCAL_EPOCHS=3
      - DATASET_SIZE=50000
    networks:
      - fl-network
    depends_on:
      fl-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  # ─── Bank B Client ──────────────────────────────────────────────
  bank-b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finguard-bank-b
    command: python -m consortium.fl_client --bank-id bank-b --server fl-server:8080
    environment:
      - BANK_ID=bank-b
      - BANK_NAME=Global Commerce Bank
      - FL_SERVER=fl-server:8080
      - DP_NOISE_MULTIPLIER=0.15
      - DP_MAX_GRAD_NORM=1.0
      - LOCAL_EPOCHS=3
      - DATASET_SIZE=80000
    networks:
      - fl-network
    depends_on:
      fl-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  # ─── Bank C Client ──────────────────────────────────────────────
  bank-c:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finguard-bank-c
    command: python -m consortium.fl_client --bank-id bank-c --server fl-server:8080
    environment:
      - BANK_ID=bank-c
      - BANK_NAME=Pacific Microfinance
      - FL_SERVER=fl-server:8080
      - DP_NOISE_MULTIPLIER=0.2
      - DP_MAX_GRAD_NORM=0.8
      - LOCAL_EPOCHS=5
      - DATASET_SIZE=20000
    networks:
      - fl-network
    depends_on:
      fl-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"

  # ─── Digital Twin Kafka Injector ────────────────────────────────
  digital-twin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finguard-digital-twin
    command: python -m digital_twin.kafka_injector --citizens 10000 --hours 168 --kafka kafka:9092
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - CITIZENS=10000
      - SIM_HOURS=168
    networks:
      - fl-network
    depends_on:
      - kafka
    profiles:
      - simulation

  # ─── MLflow (Global Model Registry) ────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:2.15.0
    container_name: finguard-fl-mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    ports:
      - "5001:5000"
    networks:
      - fl-network
    volumes:
      - mlflow-data:/mlflow

  # ─── Kafka (for Digital Twin injection) ─────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: finguard-fl-kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    ports:
      - "9093:9092"
    networks:
      - fl-network
    profiles:
      - simulation

volumes:
  mlflow-data:
