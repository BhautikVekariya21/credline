# Credit Line Fintech Solution — Phase 16: Master Genesis Deployment Matrix
# Helm values configuration orchestrating zero-trust cross-services mutual TLS (mTLS) 
# and autoscaling resource limits across all 16 microservice layers.

global:
  environment: production
  domain: creditline.io
  serviceMesh:
    type: istio
    mutualTLS:
      mode: STRICT # Enforce strict zero-trust cryptographic service-to-service communication
  registry: registry.creditline.io

# ─── Service 1: React 19 Client Webapp ──────────────────────────────────────────
frontend:
  replicaCount: 3
  image:
    repository: credit-line/frontend-console
    tag: v2026.5.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: console.creditline.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: credit-line-console-tls
        hosts:
          - console.creditline.io

# ─── Service 2: FastAPI API Gateway ───────────────────────────────────────────
gatewayApi:
  replicaCount: 4
  image:
    repository: credit-line/gateway-api
    tag: v2026.5.0
    pullPolicy: IfNotPresent
  env:
    VITE_API_URL: "https://api.creditline.io"
    APP_ENV: "production"
    LOG_LEVEL: "INFO"
    DB_POOL_SIZE: "20"
    KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster-kafka-bootstrap.kafka.svc:9092"
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 4
    maxReplicas: 12
    targetCPUUtilizationPercentage: 75

# ─── Service 3: Rust core Transaction Ingest ──────────────────────────────────
coreIngestion:
  replicaCount: 6
  image:
    repository: credit-line/core-ingestion-rust
    tag: v2026.5.0
  env:
    KAFKA_TOPIC: "transactions.incoming"
    REDIS_URL: "redis-master.cache.svc:6379"
  resources:
    limits:
      cpu: 2000m
      memory: 1024Mi
    requests:
      cpu: 500m
      memory: 256Mi

# ─── Service 4: PyTorch Alternative Underwriting ──────────────────────────────
creditEngine:
  replicaCount: 3
  image:
    repository: credit-line/credit-underwriter-pytorch
    tag: v2026.5.0
  resources:
    limits:
      cpu: 4000m
      memory: 8192Mi  # Larger limits for PyTorch GNN/attention weight tensors
    requests:
      cpu: 1000m
      memory: 2048Mi

# ─── Service 5: Autonomous Compliance & Tax ───────────────────────────────────
complianceTaxOrchestrator:
  replicaCount: 2
  image:
    repository: credit-line/compliance-tax-orchestrator
    tag: v2026.5.0
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 512Mi

# ─── Service 6: ZK-SNARK Solvency Auditor ──────────────────────────────────────
zkAuditorProver:
  replicaCount: 2
  image:
    repository: credit-line/zk-auditor-prover
    tag: v2026.5.0
  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi  # Merkle tree building & cryptographic proof generation
    requests:
      cpu: 500m
      memory: 512Mi

# ─── Database & Feature Store Dependencies ────────────────────────────────────
postgresql:
  enabled: true
  auth:
    database: credit_line_ledger
  primary:
    resources:
      limits:
        cpu: 2000m
        memory: 4096Mi
      requests:
        cpu: 500m
        memory: 1024Mi
    persistence:
      size: 50Gi

redis:
  enabled: true
  architecture: replication
  master:
    resources:
      limits:
        cpu: 1000m
        memory: 2048Mi
      requests:
        cpu: 200m
        memory: 512Mi

kafka:
  enabled: true
  replicaCount: 3
  zookeeper:
    replicaCount: 3
  persistence:
    size: 100Gi
