# ═══════════════════════════════════════════════════════════════════════════
# FinGuard 2026 — Docker Compose (Full Development Environment)
# Phase 2: Added MLflow, Neo4j, PostgreSQL, Frontend, and Vault
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ─── FinGuard API ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finguard-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_KEY=dev-api-key-change-in-production
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql://finguard:finguard2026@postgres:5432/finguard
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=finguard2026
      - REDIS_HOST=redis
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_DEVICE=cpu
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ─── React Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

  # ─── PostgreSQL (User Data & Audit Logs) ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: finguard-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: finguard
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: finguard2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Neo4j (Graph Database) ───────────────────────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: finguard-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/finguard2026
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "finguard2026", "RETURN 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Apache Kafka (via Redpanda) ──────────────────────────────────────
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: finguard-kafka
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://kafka:29092,external://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - kafka_data:/var/lib/redpanda/data

  # ─── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: finguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── MLflow (Model Registry & Tracking) ───────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: finguard-mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///mlflow.db
        --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Prometheus ───────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: finguard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  # ─── Grafana ──────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: finguard-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=finguard2026
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  neo4j_data:
  kafka_data:
  redis_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
